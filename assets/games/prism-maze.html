<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Световой лабиринт</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;height:100svh;background:#111d2d;color:#f8efd9;font:15px system-ui;text-align:center;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:8px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom));touch-action:manipulation}h1{font-size:19px;margin:0}p{margin:3px}main{position:relative;min-height:0;display:flex;justify-content:center}canvas{height:100%;max-width:100%;object-fit:contain;touch-action:none}button{font:inherit;min-height:44px;min-width:44px;background:#284963;border:1px solid #718ca6;border-radius:10px;color:inherit;padding:6px 12px;touch-action:manipulation}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding-top:6px}#overlay{position:absolute;inset:0;display:grid;place-content:center;background:#111d2de0}#overlay[hidden],#restart[hidden],output{display:none}
</style></head><body><header><h1>Световой лабиринт · авторская офлайн-игра</h1><p>Собери 6 огней и доберись до выхода. Избегай двух стражей!</p><p id="hud">Огни: 0/6</p></header><main><canvas width="288" height="288" data-yaplix-input aria-label="Лабиринт; касание рядом с героем — шаг"></canvas><div id="overlay"><p id="result">Стены не пропускают. Стражи преследуют.</p><button id="start" data-yaplix-start>Старт</button></div></main><footer><div class="controls"><button id="left" aria-label="Влево">←</button><button id="up" aria-label="Вверх">↑</button><button id="down" aria-label="Вниз">↓</button><button id="right" aria-label="Вправо">→</button><button id="pause" data-yaplix-pause>Пауза</button><button id="restart" data-yaplix-restart hidden>Заново</button></div></footer><output data-yaplix-state></output><script>
const telemetry={session:null,next:0,ended:false};
function report(type,data={}){if(!telemetry.session||telemetry.ended||parent===window)return;parent.postMessage({channel:'yaplix',event:{protocolVersion:1,eventId:crypto.randomUUID(),sessionId:telemetry.session.sessionId,versionId:telemetry.session.versionId,sequence:telemetry.next++,timestamp:Date.now(),type,data}},'*');if(type==='session_ended')telemetry.ended=true;}
addEventListener('message',({source,data})=>{if(source===parent&&data?.channel==='yaplix_init'&&data.protocolVersion===1&&!telemetry.session){telemetry.session=data;report('game_ready');}});
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),out=document.querySelector('output'),N=9,C=32;
const walls=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x===0||y===0||x===N-1||y===N-1||(x%2===0&&y%2===0)||(x===4&&y===3)?1:0));
const initialCoins=[[3,1],[5,1],[3,3],[5,5],[1,5],[7,5]],exit={x:7,y:7};let player={x:1,y:1},coins=initialCoins.map(([x,y])=>({x,y})),enemies=[{x:7,y:1},{x:1,y:7}],score=0,phase='ready',paused=false,raf=0,last=0,clock=0,everStarted=false;
function snapshot(){out.textContent=JSON.stringify({phase:paused?'paused':phase,score,player,coins,enemies,walls,exit});document.querySelector('#hud').textContent=`Огни: ${score}/6${score===6?' · Выход открыт!':''}`;}
function draw(){ctx.fillStyle='#12243a';ctx.fillRect(0,0,N*C,N*C);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(walls[y][x]){ctx.fillStyle='#3b536b';ctx.fillRect(x*C+1,y*C+1,C-2,C-2);}ctx.fillStyle=score===6?'#a4f2bf':'#52695e';ctx.fillRect(exit.x*C+6,exit.y*C+6,20,20);for(const c of coins){ctx.fillStyle='#ffdd88';ctx.beginPath();ctx.arc(c.x*C+16,c.y*C+16,5,0,7);ctx.fill();}for(const e of enemies){ctx.fillStyle='#ef799a';ctx.fillRect(e.x*C+8,e.y*C+8,16,16);}ctx.fillStyle='#7be1e0';ctx.beginPath();ctx.arc(player.x*C+16,player.y*C+16,10,0,7);ctx.fill();}
function end(won){phase=won?'won':'lost';cancelAnimationFrame(raf);document.querySelector('#overlay').hidden=false;document.querySelector('#start').hidden=true;document.querySelector('#result').textContent=won?'Выход найден! Победа.':'Страж догнал. Попробуй другой путь.';report(won?'game_won':'game_lost');report('session_ended');}
function collision(){if(enemies.some(e=>e.x===player.x&&e.y===player.y))end(false);}
function step(dx,dy){if(phase!=='playing'||paused)return;const x=player.x+dx,y=player.y+dy;if(walls[y]?.[x]===0){player={x,y};const old=coins.length;coins=coins.filter(c=>c.x!==x||c.y!==y);if(old!==coins.length){score++;report('score_changed',{score});}collision();if(phase==='playing'&&score===6&&x===exit.x&&y===exit.y)end(true);}snapshot();draw();}
function chase(enemy){const queue=[[enemy.x,enemy.y]],seen=new Set([enemy.x+','+enemy.y]),previous=new Map();let found=false;for(let i=0;i<queue.length;i++){const [x,y]=queue[i];if(x===player.x&&y===player.y){found=true;break;}for(const [dx,dy]of [[1,0],[0,1],[-1,0],[0,-1]]){const nx=x+dx,ny=y+dy,key=nx+','+ny;if(walls[ny]?.[nx]===0&&!seen.has(key)){seen.add(key);previous.set(key,[x,y]);queue.push([nx,ny]);}}}if(!found)return;let cursor=[player.x,player.y];while(previous.has(cursor.join(','))){const p=previous.get(cursor.join(','));if(p[0]===enemy.x&&p[1]===enemy.y){enemy.x=cursor[0];enemy.y=cursor[1];return;}cursor=p;}}
function tick(time){if(phase!=='playing'||paused)return;clock+=Math.min((time-last)/1000,.08);last=time;if(clock>=1.5){clock=0;for(const enemy of enemies)chase(enemy);collision();snapshot();draw();}if(phase==='playing')raf=requestAnimationFrame(tick);}
function start(){cancelAnimationFrame(raf);if(!everStarted){everStarted=true;report('game_started');}player={x:1,y:1};coins=initialCoins.map(([x,y])=>({x,y}));enemies=[{x:7,y:1},{x:1,y:7}];score=clock=0;phase='playing';paused=false;document.querySelector('#overlay').hidden=true;document.querySelector('#restart').hidden=false;document.querySelector('#pause').textContent='Пауза';snapshot();draw();last=performance.now();raf=requestAnimationFrame(tick);}
function pause(){if(phase!=='playing')return;paused=!paused;cancelAnimationFrame(raf);document.querySelector('#pause').textContent=paused?'Продолжить':'Пауза';snapshot();if(!paused){last=performance.now();raf=requestAnimationFrame(tick);}}
document.querySelector('#start').onclick=start;document.querySelector('#restart').onclick=start;document.querySelector('#pause').onclick=pause;for(const[id,dx,dy]of [['left',-1,0],['right',1,0],['up',0,-1],['down',0,1]])document.querySelector('#'+id).onclick=()=>step(dx,dy);
addEventListener('keydown',e=>{const action={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(action){e.preventDefault();step(...action);}});canvas.onpointerdown=e=>{const box=canvas.getBoundingClientRect(),x=(e.clientX-box.left)*N/box.width-player.x-.5,y=(e.clientY-box.top)*N/box.height-player.y-.5;if(Math.abs(x)>Math.abs(y))step(Math.sign(x),0);else if(y)step(0,Math.sign(y));};
addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='playing'&&!paused)pause();});draw();snapshot();
</script></body></html>
