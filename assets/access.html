<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Вход — YAPLIX</title><link rel="stylesheet" href="/ui/style.css"><script type="module" src="/runtime/access-ui.js"></script></head>
<body><main class="access"><a class="brand" href="/">YAPLIX</a><h1>Открыть рабочее место</h1><p>Введите ключ, который владелец показал в терминале сервера. Ключ даёт доступ к общим играм команды.</p><form class="panel"><label for="access-key">Ключ доступа</label><input id="access-key" type="password" autocomplete="off" maxlength="128" required><button class="primary" type="submit">Войти</button><p id="access-message" role="status"></p></form><p class="muted">LAN HTTP — только для доверенной тестовой сети. Для публичного доступа нужен HTTPS. Node и LLM работают на сервере.</p></main></body></html>
