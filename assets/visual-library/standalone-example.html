<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Standalone Game Example (Autonomous)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #050510; font-family: 'Courier New', monospace; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #ui { position: absolute; top: 10px; left: 10px; color: #0ff; font-size: 16px; font-weight: bold; text-shadow: 0 0 5px #0ff; pointer-events: none; z-index: 10; }
    #controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; display: flex; z-index: 5; }
    .control-zone { flex: 1; border-top: 1px solid rgba(0, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; color: rgba(0, 255, 255, 0.4); font-size: 14px; transition: background 0.1s; }
    .control-zone:active { background: rgba(0, 255, 255, 0.1); }
    #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; background: transparent; border: 2px solid #0ff; color: #0ff; font-size: 18px; cursor: pointer; box-shadow: 0 0 10px #0ff; z-index: 20; }
  </style>
  
  <!-- INLINE VISUAL LIBRARY (v2.0) -->
  <script>
  // ============================================================
  // YAPLIX Visual Effects Library v2.0 (INLINE)
  // This entire block is embedded directly into the HTML.
  // No external files required.
  // ============================================================
  (function (global) {
    'use strict';

    function setupCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0, dpr = 1;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      return { canvas, ctx, getSize() { return { width, height, dpr }; } };
    }

    function setupUnifiedInput(controlsId, opts = {}) {
      const input = { left: false, right: false, up: false, down: false };
      const KEY_LEFT  = ['ArrowLeft',  'a', 'A', 'ф', 'Ф'];
      const KEY_RIGHT = ['ArrowRight', 'd', 'D', 'в', 'В'];
      const KEY_UP    = ['ArrowUp',    'w', 'W', 'ц', 'Ц'];
      const KEY_DOWN  = ['ArrowDown',  's', 'S', 'ы', 'Ы'];

      const setFromXY = (clientX, clientY) => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        input.left  = clientX <  w / 3;
        input.right = clientX > (w * 2 / 3);
        if (opts.vertical) {
          input.up   = clientY <  h / 3;
          input.down = clientY > (h * 2 / 3);
        }
      };
      const clearInput = () => { 
        input.left = false; input.right = false; 
        if (opts.vertical) { input.up = false; input.down = false; }
      };

      window.addEventListener('keydown', (e) => {
        if (KEY_LEFT.includes(e.key))  { input.left  = true; e.preventDefault(); }
        if (KEY_RIGHT.includes(e.key)) { input.right = true; e.preventDefault(); }
        if (opts.vertical) {
          if (KEY_UP.includes(e.key))   { input.up   = true; e.preventDefault(); }
          if (KEY_DOWN.includes(e.key)) { input.down = true; e.preventDefault(); }
        }
        if (e.key === ' ') e.preventDefault();
      }, { passive: false });

      window.addEventListener('keyup', (e) => {
        if (KEY_LEFT.includes(e.key))  input.left  = false;
        if (KEY_RIGHT.includes(e.key)) input.right = false;
        if (opts.vertical) {
          if (KEY_UP.includes(e.key))   input.up   = false;
          if (KEY_DOWN.includes(e.key)) input.down = false;
        }
      });

      const controls = document.getElementById(controlsId);
      if (controls) {
        const touchHandler = (e) => {
          e.preventDefault();
          const t = e.touches[0];
          if (t) setFromXY(t.clientX, t.clientY); else clearInput();
        };
        controls.addEventListener('touchstart',  touchHandler, { passive: false });
        controls.addEventListener('touchmove',   touchHandler, { passive: false });
        controls.addEventListener('touchend',    (e) => { e.preventDefault(); clearInput(); }, { passive: false });
        controls.addEventListener('touchcancel', () => clearInput());
        controls.addEventListener('mousedown',   (e) => setFromXY(e.clientX, e.clientY));
      }
      window.addEventListener('mouseup', clearInput);
      window.addEventListener('blur', clearInput);

      return { input, clearInput };
    }

    class Particle {
      constructor(x, y, color, opts = {}) {
        this.x = x; this.y = y;
        const spread = opts.spread ?? 10;
        this.vx = (Math.random() - 0.5) * spread;
        this.vy = (Math.random() - 0.5) * spread;
        this.life = 1.0;
        this.decay = opts.decay ?? 0.025;
        this.color = color;
        this.size = (opts.minSize ?? 2) + Math.random() * ((opts.maxSize ?? 4) - (opts.minSize ?? 2));
        this.glow = opts.glow ?? 0;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.life -= this.decay;
        this.size *= 0.95;
      }
      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.glow > 0) {
          ctx.shadowBlur = this.glow;
          ctx.shadowColor = this.color;
        }
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
        ctx.fill();
        if (this.glow > 0) {
          ctx.shadowBlur = 0;
        }
      }
      get dead() { return this.life <= 0; }
    }

    Particle.drawAll = function(ctx, particles) {
      if (!particles.length) return;
      ctx.save();
      particles.forEach(p => p.draw(ctx));
      ctx.restore();
      ctx.globalAlpha = 1.0;
    };

    class PixelParticle {
      constructor(x, y, color, opts = {}) {
        this.x = Math.floor(x); this.y = Math.floor(y);
        const spread = opts.spread ?? 4;
        this.vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * spread + 2);
        this.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * spread + 2);
        this.life = 1.0;
        this.decay = opts.decay ?? 0.03;
        this.gravity = opts.gravity ?? 0.3;
        this.color = color;
        this.size = Math.random() > 0.5 ? (opts.big ?? 6) : (opts.small ?? 3);
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.gravity;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
      }
      get dead() { return this.life <= 0; }
    }

    PixelParticle.drawAll = function(ctx, particles) {
      if (!particles.length) return;
      ctx.save();
      particles.forEach(p => p.draw(ctx));
      ctx.restore();
      ctx.globalAlpha = 1.0;
    };

    function spawnExplosion(x, y, color, ParticleClass, count = 15, opts = {}) {
      const out = [];
      for (let i = 0; i < count; i++) out.push(new ParticleClass(x, y, color, opts));
      return out;
    }

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

    function collides(a, b) {
      return Math.abs(a.x - b.x) < (a.size + b.size) && Math.abs(a.y - b.y) < (a.size + b.size);
    }

    function clampDelta(dt, max = 100) { return Math.min(dt, max); }

    function setupLoop(callback) {
      let lastTime = 0;
      let running = false;
      let rafId = null;

      function loop(timestamp) {
        if (!running) return;
        const dt = clampDelta(timestamp - lastTime);
        lastTime = timestamp;
        callback(dt);
        rafId = requestAnimationFrame(loop);
      }

      return {
        start() {
          if (running) return;
          running = true;
          lastTime = performance.now();
          rafId = requestAnimationFrame(loop);
        },
        stop() {
          running = false;
          if (rafId) cancelAnimationFrame(rafId);
        },
        isRunning() { return running; }
      };
    }

    global.YaplixFx = {
      setupCanvas,
      setupUnifiedInput,
      Particle,
      PixelParticle,
      spawnExplosion,
      clamp,
      collides,
      clampDelta,
      setupLoop
    };
  })(typeof window !== 'undefined' ? window : globalThis);
  </script>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">SCORE: <span id="score">0</span> | LIVES: <span id="lives">3</span></div>
  <button id="start-btn" data-yaplix-start>START GAME</button>
  <div id="controls" data-yaplix-input style="display: none;">
    <div class="control-zone">◀ MOVE LEFT</div>
    <div class="control-zone">MOVE RIGHT ▶</div>
  </div>

  <script>
    // Game logic using the inline library
    const Fx = window.YaplixFx;
    const { ctx, getSize } = Fx.setupCanvas('gameCanvas');
    const { input } = Fx.setupUnifiedInput('controls');

    let player = { x: 0, y: 0, size: 20, speed: 6, color: '#0ff' };
    let particles = [], targets = [];
    let score = 0, lives = 3;
    let spawnTimer = 0;
    const MAX_TARGETS = 10;

    const loop = Fx.setupLoop((dt) => {
      const { width, height } = getSize();
      
      if (input.left) player.x -= player.speed;
      if (input.right) player.x += player.speed;
      player.x = Fx.clamp(player.x, player.size, width - player.size);

      spawnTimer += dt;
      if (spawnTimer > 800 && targets.length < MAX_TARGETS) {
        targets.push({ x: Math.random() * (width - 40) + 20, y: -20, size: 15, speed: 3, color: '#f0f' });
        spawnTimer = 0;
      }

      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        t.y += t.speed;
        if (Fx.collides(t, player)) {
          particles.push(...Fx.spawnExplosion(t.x, t.y, t.color, Fx.Particle, 20, { glow: 10 }));
          targets.splice(i, 1);
          score += 100;
          document.getElementById('score').textContent = score;
        } else if (t.y > height + 20) {
          targets.splice(i, 1);
        }
      }

      particles.forEach(p => p.update());
      particles = particles.filter(p => !p.dead);

      ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = player.color;
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.size);
      ctx.lineTo(player.x - player.size, player.y + player.size);
      ctx.lineTo(player.x + player.size, player.y + player.size);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      targets.forEach(t => {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = t.color;
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x - t.size, t.y - t.size, t.size * 2, t.size * 2);
        ctx.restore();
      });

      Fx.Particle.drawAll(ctx, particles);
    });

    window.addEventListener('resize', () => {
      const { width, height } = getSize();
      player.x = Fx.clamp(player.x, player.size, width - player.size);
      player.y = height - 100;
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      const { width, height } = getSize();
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('controls').style.display = 'flex';
      player.x = width / 2;
      player.y = height - 100;
      loop.start();
    });
  </script>
</body>
</html>
