<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Retro Visual Library</title>
  <style>
    /* --- REUSABLE: Base Reset & Pixel Perfect --- */
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    body { background: #2b2b2b; overflow: hidden; font-family: 'Courier New', monospace; image-rendering: pixelated; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    
    /* --- REUSABLE: UI Overlay (Retro Style) --- */
    #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; pointer-events: none; z-index: 10; text-shadow: 2px 2px 0 #000; }
    
    /* --- REUSABLE: Touch Controls --- */
    #controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; display: flex; z-index: 5; }
    .control-zone { flex: 1; border-top: 4px solid #555; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; font-weight: bold; transition: background 0.1s; }
    .control-zone:active { background: #444; color: #fff; }
    
    /* YAPLIX Contract Compliance */
    #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; background: #fff; border: 4px solid #000; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0 #000; z-index: 20; }
    #start-btn:active { transform: translate(-46%, -46%); box-shadow: 2px 2px 0 #000; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">SCORE: <span id="score">0</span> | LIVES: <span id="lives">3</span></div>
  
  <button id="start-btn" data-yaplix-start>START GAME</button>
  
  <div id="controls" data-yaplix-input style="display: none;">
    <div class="control-zone" id="left-zone">◀ LEFT</div>
    <div class="control-zone" id="right-zone">RIGHT ▶</div>
  </div>

  <script>
    // ==========================================
    // REUSABLE COMPONENT: Canvas Setup (Pixel Perfect)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false; // Critical for pixel art
    let width, height, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // REUSABLE COMPONENT: Input Handler
    // ==========================================
    const input = { left: false, right: false };
    const setupInput = (zoneId, direction) => {
      const zone = document.getElementById(zoneId);
      const start = (e) => { e.preventDefault(); input[direction] = true; };
      const end = (e) => { e.preventDefault(); input[direction] = false; };
      zone.addEventListener('touchstart', start, { passive: false });
      zone.addEventListener('touchend', end, { passive: false });
      zone.addEventListener('mousedown', start);
      zone.addEventListener('mouseup', end);
      zone.addEventListener('mouseleave', end);
    };
    setupInput('left-zone', 'left');
    setupInput('right-zone', 'right');

    // ==========================================
    // REUSABLE COMPONENT: Pixel Particle System
    // ==========================================
    class PixelParticle {
      constructor(x, y, color) {
        this.x = Math.floor(x); this.y = Math.floor(y);
        this.vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 4 + 2);
        this.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 4 + 2);
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() > 0.5 ? 4 : 2; // Blocky sizes
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.2; // Gravity
        this.life -= 0.03;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
        ctx.globalAlpha = 1.0;
      }
    }

    // ==========================================
    // GAME STATE & LOOP
    // ==========================================
    let player = { x: 0, y: 0, size: 16, speed: 6, color: '#fff' };
    let particles = [];
    let score = 0, lives = 3;
    let isRunning = false;
    let lastTime = 0;
    let frameCount = 0;

    function spawnPixelExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) particles.push(new PixelParticle(x, y, color));
    }

    function update(dt) {
      if (input.left) player.x -= player.speed;
      if (input.right) player.x += player.speed;
      
      player.x = Math.max(player.size, Math.min(width - player.size, player.x));

      // Simulate collision
      if (frameCount % 60 === 0) {
        spawnPixelExplosion(player.x, player.y - 20, '#ffcc00');
        score += 50;
        document.getElementById('score').textContent = score;
      }
      frameCount++;

      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => p.update());
    }

    function draw() {
      // Solid clear (no trails in retro style)
      ctx.fillStyle = '#2b2b2b';
      ctx.fillRect(0, 0, width, height);

      // Draw Player (Pixel Ship)
      ctx.fillStyle = player.color;
      // Simple 3x3 pixel art representation scaled up
      const s = player.size / 3;
      ctx.fillRect(player.x - s, player.y - s, s, s); // left wing
      ctx.fillRect(player.x + s, player.y - s, s, s); // right wing
      ctx.fillRect(player.x - s, player.y, s * 3, s * 2); // body

      // Draw Particles
      particles.forEach(p => p.draw(ctx));
    }

    function loop(timestamp) {
      if (!isRunning) return;
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // YAPLIX Contract: Start Button
    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('controls').style.display = 'flex';
      player.x = width / 2;
      player.y = height - 80;
      isRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
