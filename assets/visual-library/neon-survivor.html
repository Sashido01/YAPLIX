<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Survivor - Complete Demo</title>
  <style>
    /* --- YAPLIX CONTRACT: Base Reset & Mobile First --- */
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      /* Safe area for iPhone notch / dynamic island */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    body { background: #050510; font-family: 'Courier New', monospace; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* --- UI Overlay (with safe-area offsets) --- */
    #ui { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; color: #0ff; font-size: 16px; font-weight: bold; text-shadow: 0 0 5px #0ff; pointer-events: none; z-index: 10; line-height: 1.5; }
    #rules { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; color: #fff; font-size: 12px; text-align: right; pointer-events: none; z-index: 10; opacity: 0.8; }

    #touch-hint {
      position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      color: rgba(0, 255, 255, 0.4); font-size: 12px; text-align: center;
      pointer-events: none; z-index: 10; display: none;
    }

    /* --- YAPLIX CONTRACT: Start/Restart Button (≥44px touch target) --- */
    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 30px; min-height: 44px; min-width: 44px;
      background: transparent; border: 2px solid #0ff;
      color: #0ff; font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 0 0 15px #0ff; z-index: 20; text-transform: uppercase;
      transition: all 0.2s; touch-action: manipulation;
    }
    #start-btn:active { background: rgba(0, 255, 255, 0.2); transform: translate(-50%, -48%); }

    #message {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 24px; font-weight: bold; text-align: center;
      text-shadow: 0 0 10px #fff; pointer-events: none; z-index: 15; display: none;
    }
  </style>

  <!-- INLINE VISUAL LIBRARY (v2.0) -->
  <script>
  (function (global) {
    'use strict';
    function setupCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0, dpr = 1;
      function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width * dpr; canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize); resize();
      return { canvas, ctx, getSize() { return { width, height, dpr }; } };
    }
    function setupUnifiedInput(controlsId, opts = {}) {
      const input = { left: false, right: false, up: false, down: false };
      const KEY_LEFT = ['ArrowLeft', 'a', 'A', 'ф', 'Ф'], KEY_RIGHT = ['ArrowRight', 'd', 'D', 'в', 'В'];
      const KEY_UP = ['ArrowUp', 'w', 'W', 'ц', 'Ц'], KEY_DOWN = ['ArrowDown', 's', 'S', 'ы', 'Ы'];
      const setFromXY = (clientX, clientY) => {
        const w = window.innerWidth, h = window.innerHeight;
        input.left = clientX < w / 3; input.right = clientX > (w * 2 / 3);
        if (opts.vertical) { input.up = clientY < h / 3; input.down = clientY > (h * 2 / 3); }
      };
      const clearInput = () => { input.left = input.right = input.up = input.down = false; };
      window.addEventListener('keydown', (e) => {
        if (KEY_LEFT.includes(e.key)) { input.left = true; e.preventDefault(); }
        if (KEY_RIGHT.includes(e.key)) { input.right = true; e.preventDefault(); }
        if (opts.vertical) {
          if (KEY_UP.includes(e.key)) { input.up = true; e.preventDefault(); }
          if (KEY_DOWN.includes(e.key)) { input.down = true; e.preventDefault(); }
        }
        if (e.key === ' ') e.preventDefault();
      }, { passive: false });
      window.addEventListener('keyup', (e) => {
        if (KEY_LEFT.includes(e.key)) input.left = false;
        if (KEY_RIGHT.includes(e.key)) input.right = false;
        if (opts.vertical) {
          if (KEY_UP.includes(e.key)) input.up = false;
          if (KEY_DOWN.includes(e.key)) input.down = false;
        }
      });
      const controls = document.getElementById(controlsId);
      if (controls) {
        const touchHandler = (e) => { e.preventDefault(); const t = e.touches[0]; if (t) setFromXY(t.clientX, t.clientY); else clearInput(); };
        controls.addEventListener('touchstart', touchHandler, { passive: false });
        controls.addEventListener('touchmove', touchHandler, { passive: false });
        controls.addEventListener('touchend', (e) => { e.preventDefault(); clearInput(); }, { passive: false });
        controls.addEventListener('touchcancel', clearInput);
        controls.addEventListener('mousedown', (e) => setFromXY(e.clientX, e.clientY));
      }
      window.addEventListener('mouseup', clearInput); window.addEventListener('blur', clearInput);
      return { input, clearInput };
    }
    class Particle {
      constructor(x, y, color, opts = {}) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * (opts.spread ?? 10);
        this.vy = (Math.random() - 0.5) * (opts.spread ?? 10);
        this.life = 1.0; this.decay = opts.decay ?? 0.025; this.color = color;
        this.size = (opts.minSize ?? 2) + Math.random() * ((opts.maxSize ?? 4) - (opts.minSize ?? 2));
        this.glow = opts.glow ?? 0;
      }
      update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; this.size *= 0.95; }
      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.glow > 0) { ctx.shadowBlur = this.glow; ctx.shadowColor = this.color; }
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2); ctx.fill();
        if (this.glow > 0) ctx.shadowBlur = 0;
      }
      get dead() { return this.life <= 0; }
    }
    Particle.drawAll = function(ctx, particles) {
      if (!particles.length) return; ctx.save(); particles.forEach(p => p.draw(ctx)); ctx.restore(); ctx.globalAlpha = 1.0;
    };
    function spawnExplosion(x, y, color, ParticleClass, count = 15, opts = {}) {
      const out = []; for (let i = 0; i < count; i++) out.push(new ParticleClass(x, y, color, opts)); return out;
    }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function collides(a, b) { return Math.abs(a.x - b.x) < (a.size + b.size) && Math.abs(a.y - b.y) < (a.size + b.size); }
    function clampDelta(dt, max = 100) { return Math.min(dt, max); }
    function setupLoop(callback) {
      let lastTime = 0, running = false, rafId = null;
      function loop(timestamp) {
        if (!running) return;
        const dt = clampDelta(timestamp - lastTime); lastTime = timestamp;
        callback(dt); rafId = requestAnimationFrame(loop);
      }
      return {
        start() { if (running) return; running = true; lastTime = performance.now(); rafId = requestAnimationFrame(loop); },
        stop() { running = false; if (rafId) cancelAnimationFrame(rafId); },
        isRunning() { return running; }
      };
    }
    global.YaplixFx = { setupCanvas, setupUnifiedInput, Particle, spawnExplosion, clamp, collides, clampDelta, setupLoop };
  })(typeof window !== 'undefined' ? window : globalThis);
  </script>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    СЧЁТ: <span id="score">0</span> / 10<br>
    ЖИЗНИ: <span id="lives">3</span>
  </div>
  <div id="rules">
    🟢 Собери 10 сфер<br>
    🔴 Избегай 3 мин
  </div>
  <div id="touch-hint">Коснись и веди палец</div>

  <div id="message"></div>
  <button id="start-btn" data-yaplix-start>НАЧАТЬ ИГРУ</button>

  <!-- YAPLIX CONTRACT: Input Zone (real bounding box for validator, but transparent to touch) -->
  <div id="controls" data-yaplix-input style="position:absolute;bottom:0;left:0;width:100%;height:40%;background:transparent;pointer-events:none;"></div>

  <script>
    const Fx = window.YaplixFx;
    const { ctx, getSize } = Fx.setupCanvas('gameCanvas');

    // Custom input: keyboard uses standard keys, touch uses "follow finger"
    const input = { left: false, right: false, up: false, down: false };
    let touchTarget = null;

    // Keyboard setup
    const KEY_LEFT = ['ArrowLeft', 'a', 'A', 'ф', 'Ф'], KEY_RIGHT = ['ArrowRight', 'd', 'D', 'в', 'В'];
    const KEY_UP = ['ArrowUp', 'w', 'W', 'ц', 'Ц'], KEY_DOWN = ['ArrowDown', 's', 'S', 'ы', 'Ы'];

    window.addEventListener('keydown', (e) => {
      if (KEY_LEFT.includes(e.key)) { input.left = true; e.preventDefault(); }
      if (KEY_RIGHT.includes(e.key)) { input.right = true; e.preventDefault(); }
      if (KEY_UP.includes(e.key)) { input.up = true; e.preventDefault(); }
      if (KEY_DOWN.includes(e.key)) { input.down = true; e.preventDefault(); }
      if (e.key === ' ') e.preventDefault();
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
      if (KEY_LEFT.includes(e.key)) input.left = false;
      if (KEY_RIGHT.includes(e.key)) input.right = false;
      if (KEY_UP.includes(e.key)) input.up = false;
      if (KEY_DOWN.includes(e.key)) input.down = false;
    });

    // Touch: "follow finger" — intuitive mobile control
    const canvas = document.getElementById('gameCanvas');
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    if (isTouchDevice) {
      document.getElementById('touch-hint').style.display = 'block';
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      touchTarget = { x: t.clientX, y: t.clientY };
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      touchTarget = { x: t.clientX, y: t.clientY };
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      touchTarget = null;
    }, { passive: false });

    canvas.addEventListener('touchcancel', () => { touchTarget = null; });

    // Game State
    let state = 'MENU';
    let score = 0;
    let lives = 3;
    const WIN_SCORE = 10;

    let player = { x: 0, y: 0, size: 15, speed: 5, color: '#0ff' };
    let enemies = [];
    let collectibles = [];
    let particles = [];
    let spawnTimer = 0;

    // Limits for long sessions (prevent memory issues on weak phones)
    const MAX_OBJECTS = 20;
    const MAX_PARTICLES = 200;

    const uiScore = document.getElementById('score');
    const uiLives = document.getElementById('lives');
    const uiMessage = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    function resetGame() {
      state = 'PLAYING';
      score = 0;
      lives = 3;
      enemies = [];
      collectibles = [];
      particles = [];
      spawnTimer = 0;
      touchTarget = null;

      const { width, height } = getSize();
      player.x = width / 2;
      player.y = height - 100;

      uiScore.textContent = score;
      uiLives.textContent = lives;
      uiMessage.style.display = 'none';
      startBtn.style.display = 'none';
    }

    function endGame(won) {
      state = won ? 'WON' : 'LOST';
      uiMessage.textContent = won ? '🎉 ПОБЕДА! 🎉' : '💥 ПОРАЖЕНИЕ 💥';
      uiMessage.style.color = won ? '#0f0' : '#f00';
      uiMessage.style.display = 'block';
      startBtn.textContent = 'ИГРАТЬ СНОВА';
      startBtn.style.display = 'block';

      particles.push(...Fx.spawnExplosion(player.x, player.y, won ? '#0f0' : '#f00', Fx.Particle, 50, { glow: 20, spread: 15 }));
    }

    function update(dt) {
      if (state !== 'PLAYING') return;

      const { width, height } = getSize();

      // 1. Player Movement
      if (touchTarget) {
        const dx = touchTarget.x - player.x;
        const dy = touchTarget.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          player.x += (dx / dist) * player.speed;
          player.y += (dy / dist) * player.speed;
        }
      }
      if (input.left) player.x -= player.speed;
      if (input.right) player.x += player.speed;
      if (input.up) player.y -= player.speed;
      if (input.down) player.y += player.speed;

      player.x = Fx.clamp(player.x, player.size, width - player.size);
      player.y = Fx.clamp(player.y, player.size, height - player.size);

      // 2. Spawning (with limits for long sessions)
      spawnTimer += dt;
      if (spawnTimer > 600 && (enemies.length + collectibles.length) < MAX_OBJECTS) {
        const isEnemy = Math.random() > 0.4;
        const obj = {
          x: Math.random() * (width - 40) + 20,
          y: -30,
          size: isEnemy ? 18 : 12,
          speed: isEnemy ? (3 + Math.random() * 2) : (2 + Math.random() * 2),
          color: isEnemy ? '#f04' : '#0f8',
          type: isEnemy ? 'enemy' : 'collectible'
        };
        if (isEnemy) enemies.push(obj);
        else collectibles.push(obj);
        spawnTimer = 0;
      }

      // 3. Update & Collide: Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        if (Fx.collides(player, e)) {
          particles.push(...Fx.spawnExplosion(e.x, e.y, '#f04', Fx.Particle, 20, { glow: 15 }));
          enemies.splice(i, 1);
          lives--;
          uiLives.textContent = lives;
          if (lives <= 0) endGame(false);
        } else if (e.y > height + 30) {
          enemies.splice(i, 1);
        }
      }

      // 4. Update & Collide: Collectibles
      for (let i = collectibles.length - 1; i >= 0; i--) {
        const c = collectibles[i];
        c.y += c.speed;

        if (Fx.collides(player, c)) {
          particles.push(...Fx.spawnExplosion(c.x, c.y, '#0f8', Fx.Particle, 15, { glow: 10 }));
          collectibles.splice(i, 1);
          score++;
          uiScore.textContent = score;
          if (score >= WIN_SCORE) endGame(true);
        } else if (c.y > height + 30) {
          collectibles.splice(i, 1);
        }
      }

      // 5. Update Particles (with hard cap)
      particles.forEach(p => p.update());
      particles = particles.filter(p => !p.dead);
      if (particles.length > MAX_PARTICLES) {
        particles = particles.slice(particles.length - MAX_PARTICLES);
      }
    }

    function draw() {
      const { width, height } = getSize();

      ctx.fillStyle = 'rgba(5, 5, 16, 0.4)';
      ctx.fillRect(0, 0, width, height);

      if (state === 'PLAYING' || state === 'WON' || state === 'LOST') {
        // Draw Player
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = player.color;
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.size);
        ctx.lineTo(player.x - player.size, player.y + player.size);
        ctx.lineTo(player.x + player.size, player.y + player.size);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Draw Enemies
        enemies.forEach(e => {
          ctx.save();
          ctx.shadowBlur = 10;
          ctx.shadowColor = e.color;
          ctx.fillStyle = e.color;
          ctx.fillRect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
          ctx.restore();
        });

        // Draw Collectibles
        collectibles.forEach(c => {
          ctx.save();
          ctx.shadowBlur = 10;
          ctx.shadowColor = c.color;
          ctx.fillStyle = c.color;
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // Draw Particles
        Fx.Particle.drawAll(ctx, particles);
      }
    }

    const loop = Fx.setupLoop((dt) => {
      update(dt);
      draw();
    });

    startBtn.addEventListener('click', () => {
      resetGame();
      if (!loop.isRunning()) loop.start();
    });

    // Initial draw
    const { width, height } = getSize();
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);
  </script>
</body>
</html>
