<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DEMO — Звёздный курьер</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10182c;color:#f5f7ff;font:16px system-ui;overscroll-behavior:contain}main{max-width:600px;margin:auto;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}h1{font-size:clamp(20px,5vw,25px);margin:8px 0}p{margin:10px 0}button{font:inherit;padding:10px 8px;min-width:44px;min-height:48px;border:0;border-radius:12px;background:#f7d449;color:#171717;touch-action:manipulation}button:disabled{opacity:.45}button:focus-visible{outline:3px solid #7edcc3;outline-offset:2px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}canvas{display:block;width:100%;height:clamp(80px,20vh,140px);border-radius:14px;background:#192645}.note{color:#aebad5;font-size:13px}#status{font-weight:700}@media(max-height:400px){main{padding:8px}h1{font-size:20px}.note{display:none}canvas{height:70px}p{margin:6px 0}}</style></head>
<body><main><p class="note">DEMO · готовая авторская игра · без LLM</p><h1>Звёздный курьер</h1><p>Соберите __GOAL__ грузов. Ловушка завершает полёт поражением.</p><canvas aria-label="Корабль и собранный груз"></canvas><p id="status" role="status">Готов к полёту</p><p>Груз: <output id="score">0</output> / __GOAL__</p><div class="controls"><button id="start">Старт</button><button id="point" disabled>Груз</button><button id="trap" disabled>Ловушка</button></div><p class="note">Enter — старт, пробел — груз. На телефоне используйте кнопки.</p></main>
<script>
// Authored DEMO: draws on actions/resize only, no animation or polling loop.
const goal=__GOAL__,start=document.querySelector('#start'),point=document.querySelector('#point'),trap=document.querySelector('#trap'),status=document.querySelector('#status'),scoreOutput=document.querySelector('#score'),canvas=document.querySelector('canvas');
let score=0,active=false,session=null,sequence=0;
function uuid(){const b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);}
function draw(){const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#f7d449';ctx.fillRect(12,r.height/2-17,44,34);ctx.fillStyle='#7edcc3';for(let i=0;i<score;i++)ctx.fillRect(64+(i%10)*Math.min(24,(r.width-80)/10),15+Math.floor(i/10)*24,12,12);}
function emit(type,data={}){if(!session||parent===window)return;parent.postMessage({channel:'yaplix',event:{protocolVersion:1,eventId:uuid(),sessionId:session.sessionId,versionId:session.versionId,sequence:sequence++,type,timestamp:Date.now(),data}},'*');}
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.channel==='yaplix_init'&&e.data.protocolVersion===1&&!session){session=e.data;emit('game_ready');}});
function finish(won){active=false;point.disabled=trap.disabled=true;start.disabled=true;status.textContent=won?'Победа':'Поражение';emit(won?'game_won':'game_lost');emit('session_ended');}
start.onclick=()=>{if(active)return;active=true;start.disabled=true;point.disabled=trap.disabled=false;status.textContent='В полёте';emit('game_started');};
point.onclick=()=>{if(!active)return;scoreOutput.textContent=String(++score);draw();emit('score_changed',{score});if(score>=goal)finish(true);};trap.onclick=()=>{if(active)finish(false);};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!start.disabled)start.click();if(e.key===' '&&active){e.preventDefault();point.click();}});
if(parent===window){const replay=document.createElement('button');replay.textContent='Перезапуск';replay.onclick=()=>location.reload();document.querySelector('main').append(replay);}
window.addEventListener('error',e=>emit('game_error',{message:String(e.message).slice(0,512)}));new ResizeObserver(draw).observe(canvas);draw();
</script></body></html>
