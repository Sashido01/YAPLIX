name: Repository checks

on:
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-checks:
    name: repository-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Retain required check names. FAST runs real checks on both platforms;
    # risky steps stay inside these jobs, so their failures fail the same checks.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # exact PR-base diff, including deletions/renames
          persist-credentials: false
      - name: Check repository conventions and links
        run: python scripts/check_repo.py
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test CI risk policy
        run: node --test scripts/ci-policy.test.mjs
      - name: Determine required coverage (unknown means FULL)
        id: scope
        run: node scripts/ci-policy.mjs
      - name: Install locked platform dependencies
        run: npm ci
      - name: FAST typecheck
        run: npm run typecheck
      - name: FAST build
        run: npm run build
      - name: Test repository checker and push protection
        run: python -m unittest discover -s scripts/tests -v
      - name: Install checker Chromium before backend contracts
        timeout-minutes: 8
        run: node scripts/browser-tests.mjs install chromium
      - name: Prepare existing packaged Chromium sandbox helper
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          helper=/opt/google/chrome/chrome-sandbox
          test -f "$helper" && test ! -L "$helper"
          dpkg-query -S "$helper" | grep -Fx 'google-chrome-stable: /opt/google/chrome/chrome-sandbox'
          expected=$(awk '$2 == "opt/google/chrome/chrome-sandbox" { print $1 }' /var/lib/dpkg/info/google-chrome-stable.md5sums)
          actual=$(md5sum "$helper" | cut -d ' ' -f 1)
          test -n "$expected" && test "$actual" = "$expected"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: FAST complete Ubuntu unit and backend contracts
        if: runner.os == 'Linux'
        run: node --test tests/*.test.ts
      - name: FAST Windows contracts and SQLite smoke
        if: runner.os == 'Windows' && steps.scope.outputs.windows-full == 'false'
        run: node --test tests/platform.test.ts tests/engine.test.ts
      - name: FULL Windows unit and backend contracts
        if: runner.os == 'Windows' && steps.scope.outputs.windows-full != 'false'
        run: node --test tests/*.test.ts
      - name: Install browser profiles
        if: steps.scope.outputs.browsers != 'false'
        timeout-minutes: 8
        run: node scripts/browser-tests.mjs install chromium webkit firefox
      - name: Install WebKit libraries on the disposable Ubuntu runner
        if: runner.os == 'Linux' && steps.scope.outputs.browsers != 'false'
        timeout-minutes: 25
        run: node scripts/browser-tests.mjs install-deps webkit
      - name: Autonomous game and isolation browser tests
        if: steps.scope.outputs.browsers != 'false'
        timeout-minutes: 45
        run: node scripts/browser-tests.mjs test
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.os }}
          path: .local/playwright-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Mobile performance and compressed size budgets
        if: steps.scope.outputs.browsers != 'false'
        timeout-minutes: 3
        run: node scripts/browser-tests.mjs performance

  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies and build
        run: |
          npm ci --cache .local/release-ci-001/bootstrap/npm-cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows Lite and Full from verified inputs
        shell: pwsh
        run: ./scripts/windows-installer-build-ci.ps1
      - name: Exercise source bootstrap and both Windows installers
        run: node scripts/windows-installer-ci.mjs
      - name: Preserve Windows installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-failure-${{ github.sha }}
          path: |
            .local/release-ci-001/evidence/windows.json
            .local/release-ci-001/evidence/*.log
            .local/release-ci-001/profiles/*/data/desktop.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Save verified Windows installers and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers-${{ github.sha }}
          path: |
            .local/release-ci-001/windows-build/packages/*.exe
            .local/release-ci-001/windows-build/packages/*.sha256
            .local/release-ci-001/evidence/windows.json
          if-no-files-found: error
          retention-days: 7

  repository-checks:
    name: repository-checks
    needs: [platform-checks, windows-installer]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require Ubuntu, Windows and installer success
        shell: bash
        run: |
          test '${{ needs.platform-checks.result }}' = success
          test '${{ needs.windows-installer.result }}' = success

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
          GITLEAKS_VERSION: '8.24.3'
