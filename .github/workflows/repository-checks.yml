name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # windows-latest is slower: full browser suite ~13.5m plus setup, unit tests
    # and performance smoke exceed a 20-minute job budget (TASK-013 observed).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository conventions and links
        run: python scripts/check_repo.py
      - name: Test repository checker and push protection
        run: python -m unittest discover -s scripts/tests -v
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - name: Install locked platform dependencies
        run: npm ci
      - name: Typecheck and platform integration tests
        run: |
          npm run typecheck
          npm test
      - name: Install browser profiles
        run: node scripts/browser-tests.mjs install --with-deps chromium webkit firefox
      - name: Prepare existing packaged Chromium sandbox helper
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          helper=/opt/google/chrome/chrome-sandbox
          test -f "$helper" && test ! -L "$helper"
          dpkg-query -S "$helper" | grep -Fx 'google-chrome-stable: /opt/google/chrome/chrome-sandbox'
          expected=$(awk '$2 == "opt/google/chrome/chrome-sandbox" { print $1 }' /var/lib/dpkg/info/google-chrome-stable.md5sums)
          actual=$(md5sum "$helper" | cut -d ' ' -f 1)
          test -n "$expected" && test "$actual" = "$expected"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Autonomous game and isolation browser tests
        run: npm run test:browser
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ matrix.os }}
          path: .local/playwright-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Mobile performance and compressed size budgets
        run: npm run performance:smoke

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
          GITLEAKS_VERSION: '8.24.3'
