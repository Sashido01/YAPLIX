<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Breaker - Retro Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    body { background: #1a1a2e; font-family: 'Courier New', monospace; image-rendering: pixelated; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }

    #ui { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; color: #fff; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 10; letter-spacing: 2px; }
    #rules { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; color: #ffcc00; font-size: 12px; text-align: right; pointer-events: none; z-index: 10; text-shadow: 2px 2px 0 #000; }

    #controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; display: none; z-index: 5; }
    .control-hint { position: absolute; bottom: 20px; color: rgba(255, 255, 255, 0.3); font-size: 14px; pointer-events: none; }
    .hint-left { left: 20px; }
    .hint-right { right: 20px; }

    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 30px; min-height: 44px; min-width: 44px;
      background: #fff; border: 4px solid #000;
      color: #000; font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 4px 4px 0 #000; z-index: 20; text-transform: uppercase;
      letter-spacing: 2px; touch-action: manipulation;
    }
    #start-btn:active { transform: translate(-46%, -46%); box-shadow: 2px 2px 0 #000; }

    #message {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 28px; font-weight: bold; text-align: center;
      text-shadow: 3px 3px 0 #000; pointer-events: none; z-index: 15; display: none;
      letter-spacing: 3px;
    }
  </style>

  <!-- INLINE VISUAL LIBRARY (v2.0) -->
  <script>
  (function (global) {
    'use strict';
    function setupCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0, dpr = 1;
      function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width * dpr; canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize); resize();
      return { canvas, ctx, getSize() { return { width, height, dpr }; } };
    }
    function setupUnifiedInput(controlsId, opts = {}) {
      const input = { left: false, right: false, up: false, down: false };
      const KEY_LEFT = ['ArrowLeft', 'a', 'A', 'ф', 'Ф'], KEY_RIGHT = ['ArrowRight', 'd', 'D', 'в', 'В'];
      const KEY_UP = ['ArrowUp', 'w', 'W', 'ц', 'Ц'], KEY_DOWN = ['ArrowDown', 's', 'S', 'ы', 'Ы'];
      const setFromXY = (clientX, clientY) => {
        const w = window.innerWidth, h = window.innerHeight;
        input.left = clientX < w / 3; input.right = clientX > (w * 2 / 3);
        if (opts.vertical) { input.up = clientY < h / 3; input.down = clientY > (h * 2 / 3); }
      };
      const clearInput = () => { input.left = input.right = input.up = input.down = false; };
      window.addEventListener('keydown', (e) => {
        if (KEY_LEFT.includes(e.key)) { input.left = true; e.preventDefault(); }
        if (KEY_RIGHT.includes(e.key)) { input.right = true; e.preventDefault(); }
        if (opts.vertical) {
          if (KEY_UP.includes(e.key)) { input.up = true; e.preventDefault(); }
          if (KEY_DOWN.includes(e.key)) { input.down = true; e.preventDefault(); }
        }
        if (e.key === ' ') e.preventDefault();
      }, { passive: false });
      window.addEventListener('keyup', (e) => {
        if (KEY_LEFT.includes(e.key)) input.left = false;
        if (KEY_RIGHT.includes(e.key)) input.right = false;
        if (opts.vertical) {
          if (KEY_UP.includes(e.key)) input.up = false;
          if (KEY_DOWN.includes(e.key)) input.down = false;
        }
      });
      const controls = document.getElementById(controlsId);
      if (controls) {
        const touchHandler = (e) => { e.preventDefault(); const t = e.touches[0]; if (t) setFromXY(t.clientX, t.clientY); else clearInput(); };
        controls.addEventListener('touchstart', touchHandler, { passive: false });
        controls.addEventListener('touchmove', touchHandler, { passive: false });
        controls.addEventListener('touchend', (e) => { e.preventDefault(); clearInput(); }, { passive: false });
        controls.addEventListener('touchcancel', clearInput);
        controls.addEventListener('mousedown', (e) => setFromXY(e.clientX, e.clientY));
      }
      window.addEventListener('mouseup', clearInput); window.addEventListener('blur', clearInput);
      return { input, clearInput };
    }
    class PixelParticle {
      constructor(x, y, color, opts = {}) {
        this.x = Math.floor(x); this.y = Math.floor(y);
        this.vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * (opts.spread ?? 4) + 2);
        this.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * (opts.spread ?? 4) + 2);
        this.life = 1.0; this.decay = opts.decay ?? 0.03;
        this.gravity = opts.gravity ?? 0.3;
        this.color = color;
        this.size = Math.random() > 0.5 ? (opts.big ?? 6) : (opts.small ?? 3);
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.life -= this.decay; }
      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
      }
      get dead() { return this.life <= 0; }
    }
    PixelParticle.drawAll = function(ctx, particles) {
      if (!particles.length) return; ctx.save(); particles.forEach(p => p.draw(ctx)); ctx.restore(); ctx.globalAlpha = 1.0;
    };
    function spawnExplosion(x, y, color, ParticleClass, count = 15, opts = {}) {
      const out = []; for (let i = 0; i < count; i++) out.push(new ParticleClass(x, y, color, opts)); return out;
    }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function collides(a, b) { return Math.abs(a.x - b.x) < (a.size + b.size) && Math.abs(a.y - b.y) < (a.size + b.size); }
    function clampDelta(dt, max = 100) { return Math.min(dt, max); }
    function setupLoop(callback) {
      let lastTime = 0, running = false, rafId = null;
      function loop(timestamp) {
        if (!running) return;
        const dt = clampDelta(timestamp - lastTime); lastTime = timestamp;
        callback(dt); rafId = requestAnimationFrame(loop);
      }
      return {
        start() { if (running) return; running = true; lastTime = performance.now(); rafId = requestAnimationFrame(loop); },
        stop() { running = false; if (rafId) cancelAnimationFrame(rafId); },
        isRunning() { return running; }
      };
    }
    global.YaplixFx = { setupCanvas, setupUnifiedInput, PixelParticle, spawnExplosion, clamp, collides, clampDelta, setupLoop };
  })(typeof window !== 'undefined' ? window : globalThis);
  </script>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    СЧЁТ: <span id="score">0</span><br>
    ЖИЗНИ: <span id="lives">3</span>
  </div>
  <div id="rules">
    🟨 Разбей все кирпичи<br>
    🏓 Не урони мяч
  </div>

  <div id="message"></div>
  <button id="start-btn" data-yaplix-start>НАЧАТЬ ИГРУ</button>

  <div id="controls" data-yaplix-input>
    <div class="control-hint hint-left">◀ ВЛЕВО</div>
    <div class="control-hint hint-right">ВПРАВО ▶</div>
  </div>

  <script>
    const Fx = window.YaplixFx;
    const { canvas, ctx, getSize } = Fx.setupCanvas('gameCanvas');
    ctx.imageSmoothingEnabled = false;
    const { input, clearInput } = Fx.setupUnifiedInput('controls');

    // Game State
    let state = 'MENU';
    let score = 0;
    let lives = 3;

    // Responsive game dimensions
    let gameWidth = 0;
    let gameOffsetX = 0;

    function updateGameDimensions() {
      const { width } = getSize();
      // Mobile (< 500px): full width. Desktop: 400px centered.
      gameWidth = Math.min(width, 400);
      gameOffsetX = (width - gameWidth) / 2;
    }

    let paddle = { x: 0, y: 0, width: 80, height: 12, speed: 7, color: '#fff' };
    let ball = { x: 0, y: 0, size: 8, vx: 0, vy: 0, speed: 5, color: '#ffcc00', launched: false };
    let bricks = [];
    let particles = [];

    // Hard cap for particles (long sessions)
    const MAX_PARTICLES = 200;

    const uiScore = document.getElementById('score');
    const uiLives = document.getElementById('lives');
    const uiMessage = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');
    const controls = document.getElementById('controls');

    const BRICK_COLORS = [
      { color: '#ff0055', points: 50 },
      { color: '#ffcc00', points: 30 },
      { color: '#00ff88', points: 20 },
      { color: '#00aaff', points: 10 }
    ];

    function layoutBricks() {
      const cols = Math.max(1, ...bricks.map(b => b.col + 1));
      const padding = 8;
      const brickWidth = Math.min(Math.floor(gameWidth * 0.15),
        Math.floor((gameWidth - padding * (cols + 1)) / cols));
      const offsetX = gameOffsetX + (gameWidth - (cols * (brickWidth + padding) - padding)) / 2;
      for (const brick of bricks) {
        brick.x = offsetX + brick.col * (brickWidth + padding);
        brick.y = 80 + brick.row * (20 + padding);
        brick.width = brickWidth;
        brick.height = 20;
      }
    }

    function createBricks() {
      bricks = [];
      const cols = Math.floor(gameWidth / (Math.floor(gameWidth * 0.15) + 8));
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < cols; col++) {
          bricks.push({ row, col, color: BRICK_COLORS[row].color,
            points: BRICK_COLORS[row].points, alive: true });
        }
      }
      layoutBricks();
    }

    function resetBall() {
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.size - 5;
      ball.vx = 0;
      ball.vy = 0;
      ball.launched = false;
    }

    function resetGame() {
      clearInput();
      state = 'PLAYING';
      score = 0;
      lives = 3;
      particles = [];

      updateGameDimensions();
      const { height } = getSize();

      paddle.width = Math.floor(gameWidth * 0.2);
      paddle.height = 12;
      paddle.x = gameOffsetX + (gameWidth - paddle.width) / 2;
      paddle.y = height - 60;

      ball.size = Math.max(6, Math.floor(gameWidth * 0.02));

      createBricks();
      resetBall();

      uiScore.textContent = score;
      uiLives.textContent = lives;
      uiMessage.style.display = 'none';
      startBtn.style.display = 'none';
      controls.style.display = 'block';
    }

    function launchBall() {
      if (!ball.launched) {
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * ball.speed * 0.7;
        ball.vy = -ball.speed;
        ball.launched = true;
      }
    }

    function endGame(won) {
      state = won ? 'WON' : 'LOST';
      uiMessage.textContent = won ? '🏆 ПОБЕДА! 🏆' : '💀 ПОРАЖЕНИЕ 💀';
      uiMessage.style.color = won ? '#ffcc00' : '#ff0055';
      uiMessage.style.display = 'block';
      startBtn.textContent = 'ИГРАТЬ СНОВА';
      startBtn.style.display = 'block';
      controls.style.display = 'none';

      const { width, height } = getSize();
      particles.push(...Fx.spawnExplosion(width / 2, height / 2, won ? '#ffcc00' : '#ff0055', Fx.PixelParticle, 40, { spread: 6, gravity: 0.2 }));
    }

    function update(dt) {
      if (state !== 'PLAYING') return;

      const { width, height } = getSize();

      // 1. Paddle Movement (constrained to game area)
      if (input.left) paddle.x -= paddle.speed;
      if (input.right) paddle.x += paddle.speed;
      paddle.x = Fx.clamp(paddle.x, gameOffsetX, gameOffsetX + gameWidth - paddle.width);

      // 2. Ball follows paddle if not launched
      if (!ball.launched) {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.size - 5;

        if (input.left || input.right) launchBall();
      } else {
        // 3. Ball Movement
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions (constrained to game area)
        if (ball.x - ball.size <= gameOffsetX || ball.x + ball.size >= gameOffsetX + gameWidth) {
          ball.vx *= -1;
          ball.x = Fx.clamp(ball.x, gameOffsetX + ball.size, gameOffsetX + gameWidth - ball.size);
        }
        if (ball.y <= ball.size) {
          ball.vy *= -1;
          ball.y = ball.size;
        }

        // Paddle collision
        if (ball.y + ball.size >= paddle.y &&
            ball.y - ball.size <= paddle.y + paddle.height &&
            ball.x >= paddle.x &&
            ball.x <= paddle.x + paddle.width &&
            ball.vy > 0) {
          ball.vy *= -1;
          const hitPos = (ball.x - paddle.x) / paddle.width;
          ball.vx = (hitPos - 0.5) * ball.speed * 2;
          ball.y = paddle.y - ball.size;
        }

        // Ball lost
        if (ball.y > height + ball.size) {
          lives--;
          uiLives.textContent = lives;
          if (lives <= 0) {
            endGame(false);
          } else {
            resetBall();
          }
        }

        // Brick collisions
        for (let i = bricks.length - 1; i >= 0; i--) {
          const brick = bricks[i];
          if (!brick.alive) continue;

          if (ball.x + ball.size > brick.x &&
              ball.x - ball.size < brick.x + brick.width &&
              ball.y + ball.size > brick.y &&
              ball.y - ball.size < brick.y + brick.height) {

            brick.alive = false;
            score += brick.points;
            uiScore.textContent = score;

            particles.push(...Fx.spawnExplosion(
              brick.x + brick.width / 2,
              brick.y + brick.height / 2,
              brick.color,
              Fx.PixelParticle,
              12,
              { spread: 3, gravity: 0.4 }
            ));

            const overlapX = Math.min(ball.x + ball.size - brick.x, brick.x + brick.width - (ball.x - ball.size));
            const overlapY = Math.min(ball.y + ball.size - brick.y, brick.y + brick.height - (ball.y - ball.size));

            if (overlapX < overlapY) {
              ball.vx *= -1;
            } else {
              ball.vy *= -1;
            }
          }
        }

        // Check win condition
        if (bricks.every(b => !b.alive)) {
          endGame(true);
        }
      }

      // 4. Update Particles (with hard cap)
      particles.forEach(p => p.update());
      particles = particles.filter(p => !p.dead);
      if (particles.length > MAX_PARTICLES) {
        particles = particles.slice(particles.length - MAX_PARTICLES);
      }
    }

    function draw() {
      const { width, height } = getSize();

      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, width, height);

      if (state === 'PLAYING' || state === 'WON' || state === 'LOST') {
        // Draw game area border (visual hint on desktop)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.strokeRect(gameOffsetX, 0, gameWidth, height);

        // Draw Bricks
        bricks.forEach(brick => {
          if (!brick.alive) return;
          ctx.fillStyle = brick.color;
          ctx.fillRect(Math.floor(brick.x), Math.floor(brick.y), brick.width, brick.height);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(Math.floor(brick.x), Math.floor(brick.y), brick.width, brick.height);
        });

        // Draw Paddle
        ctx.fillStyle = paddle.color;
        ctx.fillRect(Math.floor(paddle.x), Math.floor(paddle.y), paddle.width, paddle.height);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(Math.floor(paddle.x), Math.floor(paddle.y), paddle.width, paddle.height);

        // Draw Ball
        ctx.fillStyle = ball.color;
        ctx.fillRect(Math.floor(ball.x - ball.size), Math.floor(ball.y - ball.size), ball.size * 2, ball.size * 2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(Math.floor(ball.x - ball.size), Math.floor(ball.y - ball.size), ball.size * 2, ball.size * 2);

        Fx.PixelParticle.drawAll(ctx, particles);
      }
    }

    // Relayout the same objects: resize must never create a new round.
    window.addEventListener('resize', () => {
      if (state === 'MENU') return;
      const oldWidth = gameWidth;
      const oldOffsetX = gameOffsetX;
      const oldPaddleY = paddle.y;
      const paddleRatio = (paddle.x - oldOffsetX) / (oldWidth - paddle.width);
      const ballRatioX = (ball.x - oldOffsetX) / oldWidth;
      const ballRatioY = ball.y / oldPaddleY;
      updateGameDimensions();
      const { height } = getSize();
      layoutBricks();
      paddle.width = Math.floor(gameWidth * 0.2);
      paddle.x = Fx.clamp(gameOffsetX + paddleRatio * (gameWidth - paddle.width),
        gameOffsetX, gameOffsetX + gameWidth - paddle.width);
      paddle.y = height - 60;
      ball.size = Math.max(6, Math.floor(gameWidth * 0.02));
      if (ball.launched) {
        ball.x = Fx.clamp(gameOffsetX + ballRatioX * gameWidth,
          gameOffsetX + ball.size, gameOffsetX + gameWidth - ball.size);
        ball.y = Fx.clamp(ballRatioY * paddle.y, ball.size, paddle.y - ball.size - 1);
      } else {
        resetBall();
      }
      ctx.imageSmoothingEnabled = false;
      draw();
    });

    const loop = Fx.setupLoop((dt) => {
      update(dt);
      draw();
    });

    startBtn.addEventListener('click', () => {
      resetGame();
      if (!loop.isRunning()) loop.start();
    });

    // Initial draw
    const { width, height } = getSize();
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, width, height);
  </script>
</body>
</html>
