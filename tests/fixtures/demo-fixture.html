<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DEMO — Звёздный курьер</title>
<style>*{box-sizing:border-box}body{margin:0;background:#091326;color:#f5f7ff;font:16px system-ui;overscroll-behavior:contain}main{max-width:640px;margin:auto;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}h1{font-size:clamp(20px,5vw,26px);margin:6px 0}p{margin:8px 0}button{font:inherit;min-width:44px;min-height:48px;border:1px solid #4b7294;border-radius:12px;background:#183755;color:#fff;touch-action:manipulation}button:disabled{opacity:.4}button:focus-visible{outline:3px solid #7edcc3;outline-offset:2px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.toolbar button{padding:8px 22px;background:#f7d449;color:#171717;border:0}canvas{display:block;width:100%;height:clamp(150px,38svh,300px);border-radius:16px;background:#10213b;touch-action:none}.note{color:#b1c3dc;font-size:13px}#status{font-weight:700;color:#7edcc3}#score{color:#f7d449;font-weight:700}@media(max-height:400px){main{padding:6px}h1{font-size:20px}.note{display:none}canvas{height:140px}p{margin:4px 0}button{min-height:44px}}</style></head>
<body><main><p class="note">DEMO · авторская игра без LLM</p><h1>Звёздный курьер</h1><p>Доставьте __GOAL__ грузов ★. Красные астероиды опасны!</p><canvas aria-label="Космическое поле: корабль, груз и астероиды"></canvas><div class="toolbar"><p id="status" role="status">Готов к полёту</p><button id="start">Старт</button></div><p>Груз: <output id="score">0</output> / __GOAL__</p><div class="controls"><button aria-label="Влево" data-dx="-1">←</button><button aria-label="Вверх" data-dy="-1">↑</button><button aria-label="Вниз" data-dy="1">↓</button><button aria-label="Вправо" data-dx="1">→</button></div><p class="note">Стрелки / WASD, кнопки или свайп по полю. Вначале груз справа, астероид снизу. Думайте на шаг вперёд.</p></main>
<script>
// Event-driven board game: input moves the ship; collecting and collisions follow its position.
const goal=__GOAL__,start=document.querySelector('#start'),status=document.querySelector('#status'),scoreOutput=document.querySelector('#score'),canvas=document.querySelector('canvas'),buttons=[...document.querySelectorAll('.controls button')];
const cols=6,rows=5,hazards=new Set(['0,1','4,1','2,2','1,3']),cargo=new Set();
for(let row=0;row<rows;row++)for(let i=0;i<cols;i++){const col=row%2?cols-1-i:i,key=col+','+row;if(key!=='0,0'&&!hazards.has(key)&&cargo.size<goal)cargo.add(key);}
let x=0,y=0,dx=1,dy=0,score=0,active=false,started=false,ended=false,session=null,sequence=0,sessionEnded=false;
function uuid(){const b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);}
function draw(){const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const w=r.width/cols,h=r.height/rows;ctx.fillStyle='#10213b';ctx.fillRect(0,0,r.width,r.height);for(let i=0;i<70;i++){ctx.fillStyle=i%3?'#496987':'#dbeaff';ctx.fillRect((i*73+19)%r.width,(i*41+13)%r.height,1.4,1.4);}ctx.strokeStyle='#203f5d';for(let i=1;i<cols;i++){ctx.beginPath();ctx.moveTo(i*w,0);ctx.lineTo(i*w,r.height);ctx.stroke();}for(let i=1;i<rows;i++){ctx.beginPath();ctx.moveTo(0,i*h);ctx.lineTo(r.width,i*h);ctx.stroke();}
for(const key of hazards){const [cx,cy]=key.split(',').map(Number);ctx.fillStyle='#d65a67';ctx.beginPath();ctx.arc((cx+.5)*w,(cy+.5)*h,Math.min(w,h)*.29,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8c354b';ctx.beginPath();ctx.arc((cx+.55)*w,(cy+.42)*h,Math.min(w,h)*.09,0,Math.PI*2);ctx.fill();}
for(const key of cargo){const [cx,cy]=key.split(',').map(Number);ctx.save();ctx.translate((cx+.5)*w,(cy+.5)*h);ctx.fillStyle='#f7d449';ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,s=Math.min(w,h)*(i%2?.12:.28);i?ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s):ctx.moveTo(Math.cos(a)*s,Math.sin(a)*s);}ctx.closePath();ctx.fill();ctx.restore();}
ctx.save();ctx.translate((x+.5)*w,(y+.5)*h);ctx.rotate(Math.atan2(dy,dx));const s=Math.min(w,h)*.34;ctx.fillStyle=ended&&score<goal?'#e58b95':'#82e7df';ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(-s*.7,-s*.7);ctx.lineTo(-s*.4,0);ctx.lineTo(-s*.7,s*.7);ctx.closePath();ctx.fill();ctx.fillStyle='#f7d449';ctx.fillRect(-s,-s*.16,s*.3,s*.32);ctx.restore();}
function emit(type,data={}){if(!session||parent===window||sessionEnded)return;parent.postMessage({channel:'yaplix',event:{protocolVersion:1,eventId:uuid(),sessionId:session.sessionId,versionId:session.versionId,sequence:sequence++,type,timestamp:Date.now(),data}},'*');if(type==='session_ended')sessionEnded=true;}
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.channel==='yaplix_init'&&e.data.protocolVersion===1&&!session){session=e.data;emit('game_ready');}});
function controls(){buttons.forEach(button=>button.disabled=!active);}
function finish(won){active=false;ended=true;controls();start.disabled=true;status.textContent=won?'Победа':'Поражение';emit(won?'game_won':'game_lost');emit('session_ended');draw();}
function move(mx,my){if(!active)return;const nx=x+mx,ny=y+my;if(nx<0||nx>=cols||ny<0||ny>=rows)return;x=nx;y=ny;dx=mx;dy=my;const key=x+','+y;if(hazards.has(key)){finish(false);return;}if(cargo.delete(key)){scoreOutput.textContent=String(++score);emit('score_changed',{score});if(score===goal){finish(true);return;}}draw();}
start.onclick=()=>{if(ended)return;active=!active;if(!started){started=true;emit('game_started');}start.textContent=active?'Пауза':'Продолжить';status.textContent=active?'В полёте':'Пауза';controls();};buttons.forEach(button=>button.onclick=()=>move(Number(button.dataset.dx||0),Number(button.dataset.dy||0)));
document.addEventListener('keydown',e=>{const keys={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]};if(keys[e.key]){e.preventDefault();move(...keys[e.key]);}if(e.key==='Enter'&&!start.disabled)start.click();});
let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;const mx=e.clientX-pointer.x,my=e.clientY-pointer.y;pointer=null;if(Math.max(Math.abs(mx),Math.abs(my))<15)return;Math.abs(mx)>Math.abs(my)?move(Math.sign(mx),0):move(0,Math.sign(my));});canvas.addEventListener('pointercancel',()=>pointer=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){active=false;start.textContent='Продолжить';status.textContent='Пауза';controls();}});
if(parent===window){const replay=document.createElement('button');replay.textContent='Перезапуск';replay.onclick=()=>location.reload();document.querySelector('main').append(replay);}
window.addEventListener('error',e=>emit('game_error',{message:String(e.message).slice(0,512)}));const canvasResizeObserver=new ResizeObserver(draw);canvasResizeObserver.observe(canvas);addEventListener('resize',draw,{passive:true});controls();draw();
</script></body></html>
